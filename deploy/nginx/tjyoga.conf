# Production site: /etc/nginx/sites-available/tjyoga
# Known SPA routes and prefixes serve index.html with 200.
# Everything else that is not a real file serves index.html with HTTP 404.
# Apply: backup, nginx -t, reload. Roll back the backup on any doubt.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 81.177.141.117 tjyoga.ru www.tjyoga.ru _;

    root /var/www/tjyoga/app/dist;
    index index.html;
    client_max_body_size 12m;

    error_page 404 =404 @spa_not_found;

    location = /login {
        return 301 /account/login$is_args$args;
    }
    location = /login/ {
        return 301 /account/login$is_args$args;
    }
    location = /register {
        return 301 /account/register$is_args$args;
    }
    location = /register/ {
        return 301 /account/register$is_args$args;
    }

    location /uploads/ {
        alias /var/www/tjyoga/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        error_page 404 =404 @static_not_found;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }

    location /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static dist folder copied by deploy.sh (not an SPA route).
    location ^~ /rates/ {
        try_files $uri $uri/ =404;
        error_page 404 =404 @static_not_found;
    }

    location ^~ /blog/ {
        try_files /index.html =404;
    }
    location ^~ /account/ {
        try_files /index.html =404;
    }
    location ^~ /checkout/ {
        try_files /index.html =404;
    }
    location ^~ /club/ {
        try_files /index.html =404;
    }
    location ^~ /payment/ {
        try_files /index.html =404;
    }
    location ^~ /admin/ {
        try_files /index.html =404;
    }

    location = / {
        try_files /index.html =404;
    }
    location = /club {
        try_files /index.html =404;
    }
    location = /free {
        try_files /index.html =404;
    }
    location = /retreats {
        try_files /index.html =404;
    }
    location = /personal {
        try_files /index.html =404;
    }
    location = /about {
        try_files /index.html =404;
    }
    location = /how-to-buy {
        try_files /index.html =404;
    }
    location = /blog {
        try_files /index.html =404;
    }
    location = /offer {
        try_files /index.html =404;
    }
    location = /policy {
        try_files /index.html =404;
    }
    location = /refund {
        try_files /index.html =404;
    }
    location = /medical-disclaimer {
        try_files /index.html =404;
    }
    location = /account {
        try_files /index.html =404;
    }
    location = /admin {
        try_files /index.html =404;
    }
    location = /checkout {
        try_files /index.html =404;
    }
    location = /free/ {
        try_files /index.html =404;
    }
    location = /retreats/ {
        try_files /index.html =404;
    }
    location = /personal/ {
        try_files /index.html =404;
    }
    location = /about/ {
        try_files /index.html =404;
    }
    location = /how-to-buy/ {
        try_files /index.html =404;
    }
    location = /offer/ {
        try_files /index.html =404;
    }
    location = /policy/ {
        try_files /index.html =404;
    }
    location = /refund/ {
        try_files /index.html =404;
    }
    location = /medical-disclaimer/ {
        try_files /index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri @static_not_found;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location @spa_not_found {
        internal;
        rewrite ^ /index.html break;
    }

    location @static_not_found {
        internal;
        default_type text/plain;
        return 404;
    }
}
